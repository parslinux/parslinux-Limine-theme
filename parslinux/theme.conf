##  Engine: Limine Bootloader (Graphical Terminal & Menu)
##  Target: 1920x1080 Full HD (Auto-scales to 2K, 4K & Widescreen)
## ==============================================================================

# Interface & Screen Resolution
interface_resolution: 1920x1080
interface_branding: ParsLinux GNU/Linux Boot Menu
interface_branding_color: 6
interface_help_hidden: no

# Wallpaper & Background Configuration
# Note: In Limine paths, boot():/ points to the partition where Limine was loaded
wallpaper: boot():/limine/themes/parslinux/background.png
wallpaper_style: stretched
backdrop: 080b12

# Graphical Terminal Styling (ParsLinux Cyber-Dark Aesthetic)
# term_background: TTRRGGBB (TT = Alpha transparency: 00=full transparent, 99=semi-dark, FF=solid)
term_background: 99080b12
term_foreground: ffffff
term_background_bright: 80161b26
term_foreground_bright: 38bdf8

# Terminal Margins and Gradient Border
term_margin: 96
term_margin_gradient: 16

# 8-color Terminal Palette (black; red; green; brown; blue; magenta; cyan; gray)
term_palette: 080b12;ef4444;10b981;f59e0b;3b82f6;8b5cf6;06b6d4;cbd5e1

# 8-color Bright Terminal Palette (dark gray; bright red; bright green; yellow; bright blue; bright magenta; bright cyan; white)
term_palette_bright: 475569;f87171;34d399;fbbf24;60a5fa;a78bfa;22d3ee;ffffff

# CP437 Console Font (8x16)
term_font: boot():/limine/themes/parslinux/parslinux.f16
term_font_size: 8x16
term_font_scale: 1x1
